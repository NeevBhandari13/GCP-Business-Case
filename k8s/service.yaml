apiVersion: v1
kind: Service
metadata:
  name: risk-scorer
  namespace: blissey
  annotations:
    # Internal load balancer — traffic stays within the VPC.
    # For the demo, remove this annotation to get a public IP for k6 access.
    # In production this would sit behind Cloud Armor + external LB.
    networking.gke.io/load-balancer-type: "Internal"
spec:
  type: LoadBalancer
  selector:
    app: risk-scorer
  ports:
    - name: http
      port: 80
      targetPort: 8080
